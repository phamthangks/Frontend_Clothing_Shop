<!-- Top Bar Start -->
<div class="top-bar-new">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center">
      <div class="top-contact">
        <span><i class="fa fa-envelope me-1"></i> support&#64;estore.com</span>
        <span class="ms-4"><i class="fa fa-phone-alt me-1"></i> +012-345-6789</span>
      </div>
      <div class="top-promo text-uppercase d-none d-md-block">
        Miễn phí giao hàng cho đơn hàng từ 500.000đ
      </div>
    </div>
  </div>
</div>
<!-- Top Bar End -->

<!-- Unified Main Header Start -->
<header class="main-header-new sticky-top">
  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg py-0">
      <!-- Logo -->
      <a routerLink="/home" class="navbar-brand-new">
        <span class="logo-e">E</span><span class="logo-store">Store</span>
      </a>

      <!-- Toggler for Mobile -->
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Content -->
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a routerLink="/home" class="nav-link-new" [class.active]="activeRoute('/home')">Trang chủ</a>
          </li>
          <li class="nav-item">
            <a routerLink="/product" class="nav-link-new" [class.active]="activeRoute('/product')">Sản phẩm</a>
          </li>
          <li class="nav-item">
            <a routerLink="/cart" class="nav-link-new" [class.active]="activeRoute('/cart')">Giỏ hàng</a>
          </li>
          <li class="nav-item">
            <a routerLink="/account" class="nav-link-new" [class.active]="activeRoute('/account')">Quản lý</a>
          </li>
        </ul>

        <!-- Action Items (Cart & User Access) -->
        <div class="header-actions d-flex align-items-center gap-3">
          <a routerLink="/cart" class="action-btn cart-btn position-relative" title="Giỏ hàng">
            <i class="fa fa-shopping-cart"></i>
          </a>
          <div class="user-access-wrapper">
            <app-useraccess></app-useraccess>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>
<!-- Unified Main Header End -->
