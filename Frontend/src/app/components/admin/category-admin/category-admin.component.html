<div class="category-management-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-content">
      <div class="title-section">
        <h1 class="page-title">
          <i class="fas fa-tags"></i>
          Quản lý Danh mục
        </h1>
        <p class="page-subtitle">Quản lý các danh mục sản phẩm thời trang</p>
      </div>
      <button class="btn-add" (click)="openAddDialog()">
        <i class="fas fa-plus"></i>
        Thêm danh mục mới
      </button>
    </div>
  </div>

  <!-- Categories Table -->
  <div class="content-card">
    <div class="table-container">
      <table class="modern-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tên danh mục</th>
            <th class="text-center">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let category of categories">
            <td><span class="item-id">#{{ category.id }}</span></td>
            <td><span class="category-name">{{ category.name }}</span></td>
            <td class="action-cell">
              <button class="action-btn edit" (click)="openEditDialog(category)" title="Chỉnh sửa">
                <i class="fas fa-edit"></i>
              </button>
              <button class="action-btn delete" (click)="openDeleteDialog(category.id, category.name)" title="Xóa">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="categories.length === 0">
      <i class="fas fa-tags"></i>
      <h3>Chưa có danh mục</h3>
      <p>Thêm danh mục đầu tiên của bạn</p>
    </div>
  </div>

  <!-- Pagination -->
  <div class="pagination-container" *ngIf="totalPages > 1">
    <button class="pagination-btn" [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
      <i class="fas fa-chevron-left"></i>
      Trước
    </button>
    <div class="pagination-pages">
      <button 
        *ngFor="let page of pages" 
        class="pagination-page" 
        [class.active]="page === currentPage"
        (click)="changePage(page)">
        {{ page }}
      </button>
    </div>
    <button class="pagination-btn" [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
      Sau
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>
