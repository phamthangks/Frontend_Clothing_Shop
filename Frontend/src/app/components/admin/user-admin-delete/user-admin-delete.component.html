<div class="modern-dialog delete-dialog">
  <div class="dialog-header">
    <div class="header-icon danger">
      <i class="fas fa-user-slash"></i>
    </div>
    <div class="header-text">
      <h2 class="dialog-title">Vô hiệu hóa người dùng</h2>
      <p class="dialog-subtitle">Tài khoản sẽ không thể đăng nhập</p>
    </div>
  </div>

  <mat-dialog-content class="dialog-content">
    <div class="warning-box">
      <div class="warning-icon">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <div class="warning-text">
        <p class="warning-title">Bạn có chắc chắn muốn vô hiệu hóa tài khoản này?</p>
        <p class="user-info">
          <i class="fas fa-user"></i>
          <span>Người dùng sẽ không thể đăng nhập vào hệ thống</span>
        </p>
        <p class="warning-note">
          <i class="fas fa-info-circle"></i>
          Bạn có thể kích hoạt lại tài khoản bất cứ lúc nào
        </p>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button 
      mat-button 
      class="btn-cancel" 
      type="button" 
      (click)="onCancel()">
      <i class="fas fa-times"></i>
      Hủy bỏ
    </button>
    <button 
      mat-raised-button 
      class="btn-delete" 
      (click)="onDelete()">
      <i class="fas fa-user-slash"></i>
      Vô hiệu hóa
    </button>
  </mat-dialog-actions>
</div>
