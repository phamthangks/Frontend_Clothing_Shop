<div class="modern-dialog delete-dialog">
  <div class="dialog-header">
    <div class="header-icon danger">
      <i class="fas fa-trash-alt"></i>
    </div>
    <div class="header-text">
      <h2 class="dialog-title">Xóa đơn hàng</h2>
      <p class="dialog-subtitle">Hành động này không thể hoàn tác</p>
    </div>
  </div>

  <mat-dialog-content class="dialog-content">
    <div class="warning-box">
      <div class="warning-icon">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <div class="warning-text">
        <p class="warning-title">Bạn có chắc chắn muốn xóa đơn hàng này?</p>
        <p class="order-info">
          <i class="fas fa-receipt"></i>
          <span>Đơn hàng sẽ bị xóa vĩnh viễn khỏi hệ thống</span>
        </p>
        <p class="warning-note">
          <i class="fas fa-info-circle"></i>
          Tất cả dữ liệu liên quan đến đơn hàng này cũng sẽ bị xóa
        </p>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button 
      mat-button 
      class="btn-cancel" 
      type="button" 
      (click)="onCancel()">
      <i class="fas fa-times"></i>
      Hủy bỏ
    </button>
    <button 
      mat-raised-button 
      class="btn-delete" 
      (click)="onDelete()">
      <i class="fas fa-trash"></i>
      Xóa đơn hàng
    </button>
  </mat-dialog-actions>
</div>
